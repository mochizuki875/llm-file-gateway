services:
  gateway:
    build:
      context: .
    ports:
      - "${GATEWAY_DOCKER_PORT:-8080}:8080"
    environment:
      VLLM_MODEL: "${VLLM_MODEL:?VLLM_MODEL is required}"
      VLLM_BASE_URL: "${VLLM_BASE_URL:?VLLM_BASE_URL is required}"
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "8080"
      GATEWAY_AUTH_REQUIRED: "${GATEWAY_AUTH_REQUIRED:-false}"
      GATEWAY_API_KEY: "${GATEWAY_API_KEY:-}"
      VLLM_API_KEY: "${VLLM_API_KEY:?VLLM_API_KEY is required}"
      GATEWAY_DATA_DIR: /var/lib/file-gateway
      FILE_TTL_SECONDS: "${FILE_TTL_SECONDS:-300}"
      MAX_FILE_BYTES: "${MAX_FILE_BYTES:-52428800}"
      MAX_REQUEST_BODY_BYTES: "${MAX_REQUEST_BODY_BYTES:-}"
      MAX_DOCUMENT_PAGES: "${MAX_DOCUMENT_PAGES:-50}"
      MAX_DOCUMENT_TEXT_CHARS: "${MAX_DOCUMENT_TEXT_CHARS:-500000}"
      MAX_DOCUMENT_PDF_BYTES: "${MAX_DOCUMENT_PDF_BYTES:-134217728}"
      MAX_DOCUMENT_PAGE_WIDTH: "${MAX_DOCUMENT_PAGE_WIDTH:-20000}"
      MAX_DOCUMENT_PAGE_HEIGHT: "${MAX_DOCUMENT_PAGE_HEIGHT:-20000}"
      MAX_DOCUMENT_PAGE_PIXELS: "${MAX_DOCUMENT_PAGE_PIXELS:-200000000}"
      MAX_DOCUMENT_PIXELS: "${MAX_DOCUMENT_PIXELS:-1000000000}"
      MAX_DOCUMENT_OOXML_MEMBERS: "${MAX_DOCUMENT_OOXML_MEMBERS:-10000}"
      MAX_DOCUMENT_OOXML_MEMBER_BYTES: "${MAX_DOCUMENT_OOXML_MEMBER_BYTES:-268435456}"
      MAX_DOCUMENT_OOXML_TOTAL_BYTES: "${MAX_DOCUMENT_OOXML_TOTAL_BYTES:-1073741824}"
      DOCUMENT_DPI: "${DOCUMENT_DPI:-300}"
      DOCUMENT_RENDER_TIMEOUT_SECONDS: "${DOCUMENT_RENDER_TIMEOUT_SECONDS:-300}"
      DOCUMENT_LIBREOFFICE_TIMEOUT_SECONDS: "${DOCUMENT_LIBREOFFICE_TIMEOUT_SECONDS:-300}"
      DOCUMENT_TEXT_EXTRACTION_ENABLED: "${DOCUMENT_TEXT_EXTRACTION_ENABLED:-true}"
      CONVERSION_WORKERS: "${CONVERSION_WORKERS:-2}"
      CONVERSION_QUEUE_CAPACITY: "${CONVERSION_QUEUE_CAPACITY:-0}"
      MAX_CONCURRENT_REQUESTS: "${MAX_CONCURRENT_REQUESTS:-0}"
      REQUEST_TIMEOUT_SECONDS: "${REQUEST_TIMEOUT_SECONDS:-300}"
      LOGLEVEL: "${LOGLEVEL:-0}"
    restart: unless-stopped